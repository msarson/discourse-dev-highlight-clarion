name: Build and Deploy Dev Environment

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.repository == 'msarson/discourse-dev-highlight-clarion'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Pull latest production subtree
        run: |
          git submodule update --init --recursive
          git submodule update --remote --merge

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Sass globally
        run: npm install -g sass

      - name: Install dependencies in dev folder
        working-directory: dev
        run: npm install

      # Create required dev folders
      - name: Create dev folders
        run: |
          mkdir -p dev/common
          mkdir -p dev/javascripts/discourse/api-initializers

      # Copy SCSS files from production/common
      - name: Copy SCSS files to dev/common
        run: |
          cp production/common/common.scss dev/common/common.scss
          cp production/common/color_definitions.scss dev/common/color_definitions.scss

      # Copy updated modern JS initializer from production
      - name: Copy JS initializer
        run: |
          cp production/javascripts/discourse/api-initializers/init-clarion-highlightjs.js \
             dev/javascripts/discourse/api-initializers/init-clarion-highlightjs.js

      # Generate light and dark mode colors
      - name: Generate Color Variables
        run: |
          node dev/generate-colors.js

      # Add import to common.scss (required for SCSS compiling)
      - name: Modify SCSS files
        run: |
          echo '@import "./generated-colors.scss";' | cat - dev/common/common.scss > temp && mv temp dev/common/common.scss

      # Compile SCSS
      - name: Compile SCSS
        working-directory: dev
        run: npm run build-scss  

      # Clean up generated SCSS artefacts
      - name: Clean up generated-colors.scss
        run: |
          rm dev/common/generated-colors.scss

      # Commit and push changes
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Automated extraction, JS sync, and SCSS compilation"
            git push "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/msarson/discourse-dev-highlight-clarion.git" HEAD:master
          fi
